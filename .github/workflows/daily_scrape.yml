name: Nightly Murmuration Scraper

on:
  schedule:
    - cron: '59 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper and SSADM audit
        run: |
          python src/fetch_sightings.py
          python src/audit_pipeline.py

      - name: Commit updated sightings data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sightings.json data/roost_sites.json
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: nightly murmuration sightings update"
          git push
