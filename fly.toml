app = "murmuration-watch-uk"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  DB_PATH = "/data_vol/murmurations.db"

[mounts]
  source = "murmurations_data"
  destination = "/data_vol"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"